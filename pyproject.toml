[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmyshow-mcp-webscraper"
version = "1.0.0"
description = "A high-performance Python web scraper, RESTful API server, and Model Context Protocol (MCP) server for BookMyShow."
readme = "README.md"

authors = [{ name = "Mohan R" }]
license = { text = "MIT" }
keywords = ["bookmyshow", "scraper", "mcp", "fastapi", "python", "movies", "showtimes"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
    "pandas>=1.5.0",
    "openpyxl>=3.0.0",
    "rich>=13.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
bms-cli = "bms_scraper.cli:main"
bms-mcp = "bms_scraper.mcp_server:run_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["bms_scraper*"]
